# main에 merge(push)되면 CI를 다시 돌리고, 통과하면 EC2에 SSH로 배포한다.
# 필요한 설정은 deploy/README.md 참고 (GitHub Environment "production"의 Secrets).
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# 배포는 한 번에 하나씩, 진행 중인 배포를 끊지 않고 순서대로
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      RELEASE_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: artifacts/backend

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/web

      # 릴리스 묶음: app.jar + web/(화면) + deploy/(서버 스크립트)
      - name: Package release
        run: |
          mkdir -p release
          jars=(artifacts/backend/*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then echo "실행 jar가 정확히 하나여야 합니다: ${jars[*]}"; exit 1; fi
          cp "${jars[0]}" release/app.jar
          cp -r artifacts/web release/web
          cp -r deploy release/deploy
          echo "$RELEASE_ID" > release/REVISION
          tar -czf "scoreroom-$RELEASE_ID.tar.gz" -C release .
          ls -lh "scoreroom-$RELEASE_ID.tar.gz"

      # 서버 호스트 키는 Secret으로 고정한다 (ssh-keyscan 결과를 그대로 믿지 않는다)
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # 서버 설정(/etc/scoreroom/scoreroom.env)을 GitHub Secrets·Variables로 만든다. 서버에서 직접 고치지 않는다
      - name: Build server config
        env:
          DB_URL: ${{ vars.DB_URL || 'jdbc:postgresql://localhost:5432/scoreroom' }}
          DB_USERNAME: ${{ secrets.DB_USERNAME || 'scoreroom' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_LOGIN_ID: ${{ secrets.SCOREROOM_ADMIN_LOGIN_ID }}
          ADMIN_PASSWORD: ${{ secrets.SCOREROOM_ADMIN_PASSWORD }}
          SECURE_COOKIE: ${{ vars.SCOREROOM_SESSION_SECURECOOKIE || 'false' }}
          SIGNUP_ENABLED: ${{ vars.SCOREROOM_SIGNUP_ENABLED || 'false' }}
          JAVA_OPTS: ${{ vars.JAVA_OPTS || '-Xms256m -Xmx1g' }}
        run: |
          umask 077
          for name in DB_PASSWORD ADMIN_LOGIN_ID ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::production 환경 Secret이 비어 있습니다: ${name/ADMIN_/SCOREROOM_ADMIN_}"
              exit 1
            fi
          done
          # systemd 설정 파일 형식: KEY="값". 값에 줄바꿈, 큰따옴표, 역슬래시는 쓸 수 없다
          entry() {
            if [[ "$2" == *$'\n'* || "$2" == *'"'* || "$2" == *'\'* ]]; then
              echo "::error::$1 값에는 줄바꿈, 큰따옴표(\"), 역슬래시(\\)를 쓸 수 없습니다."
              exit 1
            fi
            printf '%s="%s"\n' "$1" "$2"
          }
          {
            entry SPRING_PROFILES_ACTIVE prod
            entry SERVER_ADDRESS 127.0.0.1
            entry SERVER_PORT 8080
            entry DB_URL "$DB_URL"
            entry DB_USERNAME "$DB_USERNAME"
            entry DB_PASSWORD "$DB_PASSWORD"
            entry UPLOAD_DIR /var/lib/scoreroom/uploads
            entry SCOREROOM_ADMIN_LOGIN_ID "$ADMIN_LOGIN_ID"
            entry SCOREROOM_ADMIN_PASSWORD "$ADMIN_PASSWORD"
            entry SCOREROOM_SESSION_SECURECOOKIE "$SECURE_COOKIE"
            entry SCOREROOM_SIGNUP_ENABLED "$SIGNUP_ENABLED"
            entry JAVA_OPTS "$JAVA_OPTS"
          } > "$RUNNER_TEMP/scoreroom.env"

      - name: Upload server config
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$EC2_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" \
            "sudo install -d -o root -g root -m 755 /etc/scoreroom && sudo sh -c 'umask 077; cat > /etc/scoreroom/scoreroom.env.next'" \
            < "$RUNNER_TEMP/scoreroom.env"

      - name: Upload release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$EC2_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "scoreroom-$RELEASE_ID.tar.gz" "$EC2_USER@$EC2_HOST:/tmp/scoreroom-$RELEASE_ID.tar.gz"

      - name: Activate release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$EC2_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" bash -s -- "$RELEASE_ID" <<'REMOTE'
          set -euo pipefail
          release_id="$1"
          archive="/tmp/scoreroom-$release_id.tar.gz"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          tar -xzf "$archive" -C "$work" ./deploy/scripts/remote-deploy.sh
          sudo bash "$work/deploy/scripts/remote-deploy.sh" "$release_id" "$archive"
          REMOTE

      - name: Clean up secrets
        if: always()
        run: rm -f ~/.ssh/deploy_key "$RUNNER_TEMP/scoreroom.env"
