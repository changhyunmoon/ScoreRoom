# ScoreRoom: React 정적 파일 + /api는 Spring Boot(127.0.0.1:8080)로 전달.
# 같은 출처로 제공해 세션 쿠키·CSRF가 그대로 동작한다.
# http(80)로만 운영한다. 배포할 때마다 이 파일로 서버 설정을 맞춘다 (서버에서 직접 고치지 말고 여기서 고친다).

# 무중단 배포: 지금 서비스 중인 앱 포트는 배포가 /etc/nginx/scoreroom-upstream.conf 한 줄(server 127.0.0.1:808x;)로 정한다.
# 새 앱이 준비되면 그 파일을 바꾸고 Nginx를 reload한다 (reload는 이미 연결된 요청을 끊지 않는다)
upstream scoreroom_api {
    include /etc/nginx/scoreroom-upstream.conf;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/scoreroom/current/web;
    index index.html;

    # 발표 자료는 파일당 50MB
    client_max_body_size 51m;

    location /api/ {
        proxy_pass http://scoreroom_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 빌드 파일은 이름에 해시가 붙어 오래 캐시해도 된다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 새 배포가 바로 보이도록 index.html은 캐시하지 않는다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }

    # 헬스체크(/actuator)는 외부에 열지 않는다 (서버 안에서 127.0.0.1:<슬롯 포트>로만 확인)
}
