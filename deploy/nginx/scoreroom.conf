# ScoreRoom: React 정적 파일 + /api는 Spring Boot(127.0.0.1:8080)로 전달.
# 같은 출처로 제공해 세션 쿠키·CSRF가 그대로 동작한다.
# http(80)로만 운영한다. 배포는 이 파일을 덮어쓰지 않으므로 서버에서 고친 내용이 유지된다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/scoreroom/current/web;
    index index.html;

    # 발표 자료는 파일당 50MB
    client_max_body_size 51m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 빌드 파일은 이름에 해시가 붙어 오래 캐시해도 된다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 새 배포가 바로 보이도록 index.html은 캐시하지 않는다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }

    # 헬스체크(/actuator)는 외부에 열지 않는다 (서버 안에서 127.0.0.1:8080으로만 확인)
}
